services:
  - type: web
    name: seven-solutions
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    buildCommand: pip install -r requirements-cloud.txt && env -u APP_ENV -u DATABASE_URL -u TEST_DATABASE_URL -u APP_ORIGIN -u RENDER_EXTERNAL_HOSTNAME -u FIRST_USER_EMAIL -u FIRST_USER_PASSWORD python -m unittest discover -s tests -v
    startCommand: python hosted_start.py
    healthCheckPath: /healthz
    autoDeployTrigger: "off"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: APP_ENV
        value: cloud
      - key: DATABASE_URL
        sync: false
      - key: FIRST_USER_EMAIL
        sync: false
      - key: FIRST_USER_PASSWORD
        sync: false
